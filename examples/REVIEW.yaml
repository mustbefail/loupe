# REVIEW.yaml — per-repository review rules for the `loupe` code-review skill.
#
# Drop this file at the ROOT of the repo you want reviewed. Each entry under
# `instructions:` becomes its own review lens, layered on top of loupe's
# built-in lenses (correctness, security, performance, maintainability,
# devops). loupe runs a lens only when the current diff touches a file it
# matches, so scoped lenses cost nothing on unrelated changes.
#
# Keys per lens:
#   name          (required)  Free-text label; also shown in that lens's findings.
#   instructions  (required)  The rules to enforce. A `|` block can bundle many;
#                             each is checked independently and reported separately.
#   fileFilters   (optional)  Glob patterns. A plain pattern is an INCLUDE; a
#                             pattern prefixed with `!` is an EXCLUDE. A file is in
#                             scope when it matches at least one include (or there
#                             are no includes at all, meaning "everything") and
#                             matches no exclude. Omit the key to apply to every file.
#   agent         (optional)  Which reviewer subagent runs the lens:
#                             code-reviewer (default) | security-reviewer | general-purpose
#   reference     (optional)  A doc path/anchor for the reviewer to consult.
#
# Custom lenses run IN ADDITION to the built-ins. To drop a built-in lens — to
# remove it, or to replace it with your own differently-named lens — list it
# under `disableDefaultLenses` (names matched case-insensitively).
#
# Two other optional top-level keys: `disableDefaultLenses` and `verify` (the
# post-fix regression gate). Both are shown below.

# Drop built-in lenses you don't want. Here we turn off the built-in
# `performance` lens because lens 4 below replaces it with a Node/TS-specific one.
disableDefaultLenses:
  - performance

# Commands loupe runs after each fix pass to confirm its own fixes didn't break
# anything (it runs them once before fixing too, so a suite that was already red
# isn't blamed on loupe). In the order listed, stopping at the first failure
# loupe itself introduced — put the cheap checks first. Use `verify: []` to opt
# out of the gate entirely.
# OPTIONAL: with this key absent, loupe autodetects a typecheck/lint/test
# command from package.json scripts or Makefile targets. Set it when the guess
# would be wrong — monorepos, a non-standard script name, a scoped test run.
#
# These are shell commands, not prompt text, so listing them here REQUESTS a
# run — it does not authorize one. loupe prints the resolved list and asks the
# reviewer before the first command executes, and under --all it ignores this
# key entirely.
verify:
  - npm run typecheck
  - npm run lint
  - npm test

instructions:
  # 1) Repo-wide house style — no fileFilters, so it runs on every changed file.
  - name: House Style
    instructions: |
      Enforce our conventions:
      - Public functions and exported types must have a doc comment.
      - Prefer early returns over deeply nested conditionals.
      - No TODO/FIXME left without a linked ticket id.

  # 2) Language-scoped lens with an include and two excludes.
  - name: TypeScript Quality
    fileFilters:
      - "**/*.ts"
      - "!**/*.test.ts"
      - "!**/*.d.ts"
    instructions: |
      - No `any` to silence the compiler — prefer `unknown` + narrowing.
      - Explicit return types on exported functions.
      - No non-null `!` assertions that paper over a possibly-undefined value.

  # 3) A domain lens routed to the security reviewer instead of the default.
  - name: Payments Safety
    agent: security-reviewer
    fileFilters:
      - "**/payments/**"
      - "**/billing/**"
    instructions: |
      - Never log full card numbers, CVV, or raw payment tokens.
      - All money math uses integer minor units (cents), never floats.
      - Idempotency keys are required on every charge/refund call.

  # 4) Replacing a built-in lens: disable it above (see disableDefaultLenses)
  #    and add your own, differently-named lens.
  - name: Node Performance
    fileFilters:
      - "**/*.ts"
    instructions: |
      Node hot paths: flag `await` inside a loop over independent work (use
      `Promise.all`), synchronous `fs`/`crypto` on a request path, and N+1
      access patterns (batch or `include` in the ORM instead of per-row queries).
